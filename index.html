<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junction Temperature Calculator - Harbinger Thermal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #0f1111; color: white; font-family: 'Inter', sans-serif; }
        .card { background: #1c1e20; border: 1px solid #333; border-radius: 16px; }
        
        input, select { 
            background: #2a2d30; 
            border: 2px solid #444; 
            color: white; 
            padding: 18px; 
            border-radius: 12px; 
            width: 100%; 
            font-size: 1.5rem; 
            font-weight: 700;
        }
        input:focus, select:focus { border-color: #60a5fa; outline: none; background: #32363a; }
        
        label { 
            display: block; 
            font-size: 1.1rem; 
            color: #9ca3af; 
            margin-bottom: 10px; 
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .node { width: 24px; height: 24px; border-radius: 50%; background: #60a5fa; position: relative; }
        .resistor { height: 4px; flex-grow: 1; background: repeating-linear-gradient(90deg, #444, #444 8px, transparent 8px, transparent 16px); margin: 0 15px; position: relative; }
        .res-label { position: absolute; top: -28px; left: 50%; transform: translateX(-50%); font-size: 13px; font-weight: 900; white-space: nowrap; color: #60a5fa; text-transform: uppercase; }
        .node-caption { font-size: 14px; font-weight: 900; margin-top: 8px; }
        
        /* Logo Styling */
        .logo-container img {
            height: 60px;
            width: auto;
            filter: drop-shadow(0 0 8px rgba(96, 165, 250, 0.3));
        }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-7xl mx-auto">
        <header class="mb-10 border-b-2 border-gray-700 pb-8 flex flex-col md:flex-row justify-between items-start md:items-end gap-6">
            <div class="flex items-center gap-6">
                <div class="logo-container">
                    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKAAAABPCAYAAACuY6m/AAAACXBIWXMAAAsTAAALEwEAmpwYAAADXklEQVR4nO2cwW7TQBCG/7XjBEhI9UuAhBAnHvoA3HHoA8A9T8An6Al6m/YEPAnH9An6ANxz6AOEHicSBySIVFES6pAnW09rO8m6u96srdf2/6SybG9mZ77Znd2ZNSmKAgDAmN0AgH885S8p0YVOfOInX9U/O/GVn/jE9/93V/8m7GfW6+Zp/V+9R68B6OQ3/T75Tv76+Tf93PrdtP6Pfv867E96fS+v46ffxZ989+YfPvGTr+pXf798r80f/P16uK79v7W8v5n293r9H6+rY6+rX/v79XfP19U0/U7t3rX+9/p868u8vpfX8dPv4k++e/MPn/jJV/Wrv1++1+YP/n49XNd+A377YqfAnuT6mYJ8Yj058p0mX68p2IAnK9gO2AnInZfN64I78Zmv6tfrz/K96NfL96I7D9+n9D9e/9Prv3p99fW9fD9eX3p99fXV9+X1vd78DveP3p7Zf/69fJ82r6v5566373X7Dvdz1v7r9X+8rk7rX9v79XfP19U0/U7t3rX+9/p868u8vpfX8dPv4k++e/MPn/jJV/Wrv1++1+YP/n49XNd+677S/+R70Z2n70f6L30/0n/p+5n9K/8/fD/S/zP/9/fL9zL/9/fL/9L/M/vP6v/0+6n+L6+vvu7p9S/9v6r/0+8/u776uun11Zf/uv9Pffm75XvRnf8D/O89eUv6V/9+Wf9976v+Z6e/u6v/vU7fI9/5X+n7kf6Xvt/r+5n97/X51pd5fS+v46ffxZ989+YfPvGTr+pXf798r80f/P16uK79v98pS3d+9TMF+cR6cuQ7Tb5eU7AB7YCc7ID0/U5+0++T7+Svn3/Tz63fTev/6Pevw/6k1/fyOn76XfzJd2/+4RM/+ap+9ffL99r8wd+vh+va/zI0y9MUn9pPU3SaeUr/9Gf7S/9Nf5p/P8f368u73r7D/Zy1/3r9H6+r0/rX9n793fN1NU2/U7t3rf+9Pt/6Mq/v5XX89Lv4k+/e/MMnfvJV/ervl++1+YO/Xw/XtX89+X3N+YtP/NRT99MTn/jJV/XP/uVn/78Ofv86nHzf9/I6fvpX79HrvXoNvX76Xfz6+Xft7vX/ev0fr6tj797X76nfX1+v6df/uv938+m/vC6m9T/t6r7u30u/u679pT+/66+n74Uxu8FfG77XfH/2Jz0AAAAASUVORK5CYII=" alt="Logo">
                </div>
                <div>
                    <h1 class="text-6xl font-black text-yellow-500 tracking-tighter uppercase leading-tight">Harbinger Thermal Network</h1>
                    <p class="text-2xl text-gray-400 font-medium mt-1">Junction Temperature (T<sub>J</sub>) Analysis</p>
                </div>
            </div>
            <div class="text-right w-full md:w-auto">
                <label>Limit T<sub>J,max</sub> [°C]</label>
                <input type="number" id="tj_max" value="125" class="w-full md:w-40 text-center text-3xl text-red-500" oninput="calculate()">
            </div>
        </header>

        <div class="card p-10 mb-8 bg-black/60">
            <h2 class="text-lg uppercase tracking-[0.2em] mb-12 text-gray-500 font-black border-l-4 border-blue-500 pl-4">Equivalent Thermal Circuit</h2>
            <div class="flex items-center justify-between px-4">
                <div class="flex flex-col items-center">
                    <div class="node bg-red-500 shadow-[0_0_15px_rgba(239,68,68,0.5)]"></div>
                    <span class="node-caption">T<sub>J</sub></span>
                </div>
                <div class="resistor"><span class="res-label">R<sub>θJC</sub> [K/W]</span></div>
                <div class="flex flex-col items-center">
                    <div class="node bg-orange-400"></div>
                    <span class="node-caption">T<sub>C</sub></span>
                </div>
                <div class="resistor"><span class="res-label" id="label-tim">R<sub>θ-TIM</sub> [K/W]</span></div>
                <div class="flex flex-col items-center">
                    <div class="node bg-yellow-400"></div>
                    <span class="node-caption">T<sub>S</sub></span>
                </div>
                <div class="resistor" id="ambient-resistor"><span class="res-label">R<sub>θSA</sub> [K/W]</span></div>
                <div class="flex flex-col items-center" id="ambient-node">
                    <div class="node bg-blue-400"></div>
                    <span class="node-caption">T<sub>A</sub></span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
            
            <div class="card p-8">
                <h2 class="text-2xl font-black text-white mb-8 border-b-2 border-gray-700 pb-4 uppercase">1. System</h2>
                <div class="space-y-8">
                    <div>
                        <label>Cooling Mode</label>
                        <select id="calc_mode" onchange="toggleMode()">
                            <option value="ambient">Ambient Air</option>
                            <option value="sink">Liquid Cold Plate</option>
                        </select>
                    </div>
                    <div>
                        <label>Power (P) [Watts]</label>
                        <input type="number" id="power" value="55" oninput="calculate()">
                    </div>
                    <div class="pt-8 border-t-2 border-gray-700">
                        <p class="text-lg text-blue-400 font-black mb-6 uppercase tracking-wider">Gap Pad / TIM</p>
                        <div class="space-y-6">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label>Thick [mm]</label>
                                    <input type="number" id="thickness" value="0.5" step="0.01" oninput="calculate()">
                                </div>
                                <div>
                                    <label>k [W/mK]</label>
                                    <input type="number" id="k_val" value="5.0" step="0.1" oninput="calculate()">
                                </div>
                            </div>
                            <div>
                                <label>Contact Area [mm²]</label>
                                <input type="number" id="area" value="128" step="1" oninput="calculate()">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card p-8">
                <h2 class="text-2xl font-black text-white mb-8 border-b-2 border-gray-700 pb-4 uppercase">2. Resistances</h2>
                <div class="space-y-8">
                    <div>
                        <label>R<sub>θJC</sub> (Junc-to-Case) [K/W]</label>
                        <input type="number" id="r_jc" value="0.19" step="0.01" oninput="calculate()">
                    </div>
                    
                    <div id="sa_container">
                        <label>R<sub>θSA</sub> (Sink-to-Air) [K/W]</label>
                        <input type="number" id="r_sa" value="0.5" step="0.01" oninput="calculate()">
                    </div>

                    <div class="pt-8 border-t-2 border-gray-700">
                        <label class="text-white text-xl">Reference Temperature [°C]</label>
                        <div id="temp_ta_box">
                            <label class="normal-case text-blue-400">Ambient Air (T<sub>A</sub>)</label>
                            <input type="number" id="t_ambient" value="50" oninput="calculate()">
                        </div>
                        <div id="temp_ts_box" class="hidden">
                            <label class="normal-case text-yellow-400">Plate Surface (T<sub>S</sub>)</label>
                            <input type="number" id="t_surface" value="75" oninput="calculate()">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card p-8 bg-black border-blue-500/30 flex flex-col justify-between">
                <div>
                    <h2 class="text-2xl font-black text-green-500 mb-8 border-b-2 border-green-900/30 pb-4 uppercase">3. Live Analysis</h2>
                    
                    <div class="space-y-4 mb-8">
                        <div class="flex justify-between items-center bg-gray-900 p-5 rounded-xl border border-gray-800">
                            <span class="text-gray-400 text-lg font-bold">R<sub>θ-TIM</sub> [K/W]</span>
                            <span id="out-rtim" class="text-2xl font-black text-blue-400 font-mono">--</span>
                        </div>
                        <div class="flex justify-between items-center bg-gray-900 p-5 rounded-xl border border-gray-800">
                            <span class="text-gray-400 text-lg font-bold">Total ΣR<sub>θ</sub> [K/W]</span>
                            <span id="out-rtotal" class="text-2xl font-black text-blue-400 font-mono">--</span>
                        </div>
                    </div>
                </div>

                <div class="text-center py-6">
                    <div id="status-badge" class="inline-block px-6 py-2 rounded-xl text-sm font-black uppercase mb-6 tracking-widest border-2">
                        STABLE
                    </div>
                    <span class="text-xl text-blue-400 uppercase tracking-[0.3em] font-black block mb-2">Junction T<sub>J</sub></span>
                    <span id="out-tj" class="text-9xl font-black text-white tracking-tighter block leading-none">--</span>
                    
                    <div class="mt-10">
                        <div class="flex justify-between text-sm font-black text-gray-500 mb-2 uppercase">
                            <span>Cold</span>
                            <span>Limit</span>
                        </div>
                        <div class="h-6 w-full bg-gray-800 rounded-full overflow-hidden p-1 border border-gray-700">
                            <div id="temp-bar" class="h-full bg-blue-500 rounded-full transition-all duration-700" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleMode() {
            const mode = document.getElementById('calc_mode').value;
            const saContainer = document.getElementById('sa_container');
            const ambientRes = document.getElementById('ambient-resistor');
            const ambientNode = document.getElementById('ambient-node');
            const taBox = document.getElementById('temp_ta_box');
            const tsBox = document.getElementById('temp_ts_box');

            if (mode === 'ambient') {
                saContainer.style.opacity = "1";
                saContainer.style.pointerEvents = "auto";
                ambientRes.style.opacity = "1";
                ambientNode.style.opacity = "1";
                taBox.classList.remove('hidden');
                tsBox.classList.add('hidden');
            } else {
                saContainer.style.opacity = "0.2";
                saContainer.style.pointerEvents = "none";
                ambientRes.style.opacity = "0";
                ambientNode.style.opacity = "0";
                taBox.classList.add('hidden');
                tsBox.classList.remove('hidden');
            }
            calculate();
        }

        function calculate() {
            const mode = document.getElementById('calc_mode').value;
            const P = parseFloat(document.getElementById('power').value) || 0;
            const TjMax = parseFloat(document.getElementById('tj_max').value) || 125;
            
            const Rjc = parseFloat(document.getElementById('r_jc').value) || 0;
            const Rsa = parseFloat(document.getElementById('r_sa').value) || 0;
            
            const thick = parseFloat(document.getElementById('thickness').value) || 0;
            const k = parseFloat(document.getElementById('k_val').value) || 0;
            const area = parseFloat(document.getElementById('area').value) || 0;

            let Rtim = 0;
            if (k > 0 && area > 0) {
                Rtim = (thick / 1000) / (k * (area / 1000000));
            }

            let totalR = 0;
            let refTemp = 0;

            if (mode === 'ambient') {
                totalR = Rjc + Rtim + Rsa;
                refTemp = parseFloat(document.getElementById('t_ambient').value) || 0;
            } else {
                totalR = Rjc + Rtim;
                refTemp = parseFloat(document.getElementById('t_surface').value) || 0;
            }

            const finalTj = refTemp + (P * totalR);

            document.getElementById('out-rtim').innerText = Rtim.toFixed(3);
            document.getElementById('out-rtotal').innerText = totalR.toFixed(3);
            document.getElementById('out-tj').innerText = finalTj.toFixed(1) + "°";

            const percentage = Math.min((finalTj / TjMax) * 100, 100);
            const bar = document.getElementById('temp-bar');
            const badge = document.getElementById('status-badge');

            bar.style.width = percentage + "%";
            
            if (finalTj > TjMax) {
                bar.style.backgroundColor = "#ef4444";
                badge.innerText = "OVERHEAT";
                badge.className = "inline-block px-6 py-2 rounded-xl text-sm font-black uppercase mb-6 tracking-widest border-2 bg-red-500/20 text-red-500 border-red-500";
            } else if (finalTj > TjMax * 0.85) {
                bar.style.backgroundColor = "#f59e0b";
                badge.innerText = "WARNING";
                badge.className = "inline-block px-6 py-2 rounded-xl text-sm font-black uppercase mb-6 tracking-widest border-2 bg-yellow-500/20 text-yellow-500 border-yellow-500";
            } else {
                bar.style.backgroundColor = "#3b82f6";
                badge.innerText = "STABLE";
                badge.className = "inline-block px-6 py-2 rounded-xl text-sm font-black uppercase mb-6 tracking-widest border-2 bg-green-500/20 text-green-500 border-green-500";
            }
        }

        window.onload = () => {
            toggleMode();
        };
    </script>
</body>
</html>
