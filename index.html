<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harbinger Thermal Network - Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #0f1111; color: white; font-family: 'Inter', sans-serif; }
        .card { background: #1c1e20; border: 1px solid #333; border-radius: 16px; }
        
        input, select { 
            background: #2a2d30; 
            border: 2px solid #444; 
            color: white; 
            padding: 18px; 
            border-radius: 12px; 
            width: 100%; 
            font-size: 1.5rem; 
            font-weight: 700;
        }
        input:focus, select:focus { border-color: #60a5fa; outline: none; background: #32363a; }
        
        label { 
            display: block; 
            font-size: 1.1rem; 
            color: #9ca3af; 
            margin-bottom: 10px; 
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .node { width: 24px; height: 24px; border-radius: 50%; background: #60a5fa; position: relative; }
        .resistor { height: 4px; flex-grow: 1; background: repeating-linear-gradient(90deg, #444, #444 8px, transparent 8px, transparent 16px); margin: 0 15px; position: relative; }
        .res-label { position: absolute; top: -28px; left: 50%; transform: translateX(-50%); font-size: 13px; font-weight: 900; white-space: nowrap; color: #60a5fa; text-transform: uppercase; }
        .node-caption { font-size: 14px; font-weight: 900; margin-top: 8px; }

        /* Custom Logo Animation */
        .logo-img {
            height: 70px;
            filter: drop-shadow(0 0 10px rgba(96, 165, 250, 0.2));
            transition: transform 0.3s ease;
        }
        .logo-img:hover { transform: scale(1.05); }
    </style>
</head>
