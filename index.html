<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermal Reliability Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f1111; color: white; font-family: 'Inter', sans-serif; }
        .card { background: #1c1e20; border: 1px solid #333; border-radius: 8px; }
        input { background: #2a2d30; border: 1px solid #444; color: white; padding: 8px; border-radius: 4px; width: 100%; }
        .danger { color: #ff4d4d; font-weight: bold; }
    </style>
</head>
<body class="p-8">

    <div class="max-w-4xl mx-auto">
        <header class="mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold">Junction Temperature ($T_J$) Calculator</h1>
            <p class="text-gray-400">Reliability Engineering Tool for Thermal Validation</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="card p-6">
                <h2 class="text-xl mb-4 border-b border-gray-600 pb-2 text-blue-400">Inputs</h2>
                
                <div class="space-y-4">
                    <div>
                        <label>Power Dissipation ($P$) in Watts</label>
                        <input type="number" id="power" value="10" oninput="calculate()">
                    </div>
                    <div>
                        <label>Ambient Temp ($T_A$) in °C</label>
                        <input type="number" id="t_ambient" value="25" oninput="calculate()">
                    </div>
                    <div>
                        <label>$\theta_{JC}$ (Junction-to-Case) °C/W</label>
                        <input type="number" id="r_jc" value="1.2" oninput="calculate()">
                    </div>
                    <div>
                        <label>$\theta_{CS}$ (Case-to-Sink) °C/W</label>
                        <input type="number" id="r_cs" value="0.5" oninput="calculate()">
                    </div>
                    <div>
                        <label>$\theta_{SA}$ (Sink-to-Ambient) °C/W</label>
                        <input type="number" id="r_sa" value="4.0" oninput="calculate()">
                    </div>
                </div>
            </div>

            <div class="card p-6 flex flex-col justify-center items-center text-center">
                <h2 class="text-xl mb-4 text-green-400">Calculated $T_J$</h2>
                <div id="result-display" class="text-6xl font-black mb-2">-- °C</div>
                <p id="status-msg" class="text-gray-400 italic">Enter values to calculate</p>
                
                <div class="mt-8 w-full bg-gray-700 h-4 rounded-full overflow-hidden">
                    <div id="temp-bar" class="bg-green-500 h-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <p class="text-xs mt-2 text-gray-500">Thermal Limit: 125°C</p>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            // Get values from DOM
            const P = parseFloat(document.getElementById('power').value) || 0;
            const Ta = parseFloat(document.getElementById('t_ambient').value) || 0;
            const Rjc = parseFloat(document.getElementById('r_jc').value) || 0;
            const Rcs = parseFloat(document.getElementById('r_cs').value) || 0;
            const Rsa = parseFloat(document.getElementById('r_sa').value) || 0;

            // Physics: Tj = Ta + P * (Rjc + Rcs + Rsa)
            const totalR = Rjc + Rcs + Rsa;
            const Tj = Ta + (P * totalR);

            // Update Display
            const display = document.getElementById('result-display');
            const msg = document.getElementById('status-msg');
            const bar = document.getElementById('temp-bar');
            
            display.innerText = Tj.toFixed(1) + " °C";

            // Reliability Logic: Safety Margins
            const percentage = Math.min((Tj / 125) * 100, 100);
            bar.style.width = percentage + "%";

            if (Tj > 125) {
                display.className = "text-6xl font-black mb-2 text-red-500";
                msg.innerHTML = "⚠️ CRITICAL: Exceeds silicon limit!";
                bar.className = "bg-red-600 h-full transition-all duration-500";
            } else if (Tj > 100) {
                display.className = "text-6xl font-black mb-2 text-yellow-500";
                msg.innerHTML = "Warning: Operating near derating limit.";
                bar.className = "bg-yellow-500 h-full transition-all duration-500";
            } else {
                display.className = "text-6xl font-black mb-2 text-green-500";
                msg.innerHTML = "Safe Operating Area";
                bar.className = "bg-green-500 h-full transition-all duration-500";
            }
        }

        // Run once on load
        window.onload = calculate;
    </script>
</body>
</html>
