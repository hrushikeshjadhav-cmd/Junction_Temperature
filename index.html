<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Thermal Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #0a0c0e; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .card { background: #15181c; border: 1px solid #2d3135; border-radius: 16px; transition: all 0.3s ease; }
        input, select { 
            background: #1f2328; border: 1px solid #3d444d; color: white; 
            padding: 10px; border-radius: 8px; width: 100%; font-size: 1rem;
        }
        input:focus { border-color: #3b82f6; outline: none; background: #252a30; }
        
        /* Thermal Color Transition Classes */
        .thermal-bg { transition: background-color 0.8s ease, filter 0.5s ease; }
        .thermal-text { transition: color 0.8s ease; }
        
        /* Component Shapes */
        .semi-body { width: 100px; height: 60px; border-radius: 4px; position: relative; margin: 0 auto; border: 2px solid rgba(255,255,255,0.1); }
        .die { width: 30px; height: 10px; background: #ff4d4d; position: absolute; top: 0; left: 35px; border-radius: 0 0 4px 4px; box-shadow: 0 0 15px rgba(255,77,77,0.4); }
        .cold-plate { width: 180px; height: 40px; border-radius: 4px; margin: 0 auto; border: 2px solid rgba(255,255,255,0.1); position: relative; }
        .tim-layer { width: 100px; height: 8px; margin: 4px auto; border-radius: 2px; background: #555; }
        
        .flow-line { height: 2px; width: 40px; background: #333; position: relative; }
        .node-label { font-size: 11px; font-weight: 700; text-transform: uppercase; margin-top: 8px; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-6">
            <div>
                <h1 class="text-3xl font-black text-white italic tracking-tighter">THERMAL<span class="text-blue-500 underline">VUE</span></h1>
                <p class="text-gray-500 text-xs font-bold uppercase tracking-widest">Steady State Junction Solver</p>
            </div>
            <div class="flex gap-4">
                <div class="text-right">
                    <label class="text-[10px] text-gray-500">T<sub>J,MAX</sub> Limit</label>
                    <input type="number" id="tj_max" value="125" class="w-20 text-center !p-1 text-sm" oninput="calculate()">
                </div>
            </div>
        </header>

        <div class="card p-10 mb-8 bg-gradient-to-b from-[#111] to-[#15181c]">
            <div class="flex flex-col md:flex-row items-center justify-around gap-8">
                
                <div class="text-center">
                    <div id="vis-junction" class="semi-body thermal-bg bg-gray-800 shadow-2xl">
                        <div id="vis-die" class="die thermal-bg"></div>
                        <div class="absolute -bottom-6 left-0 right-0 text-[10px] font-bold text-gray-400 uppercase">Semiconductor</div>
                    </div>
                    <div id="txt-tj" class="mt-8 text-2xl font-black thermal-text">--°C</div>
                    <div class="node-label text-red-500">Junction (T<sub>J</sub>)</div>
                </div>

                <div class="flow-line hidden md:block"></div>

                <div class="text-center">
                    <div id="vis-tim" class="tim-layer thermal-bg opacity-80"></div>
                    <div class="node-label text-orange-400 mt-2">TIM Layer (R<sub>θCS</sub>)</div>
                    <div id="txt-tc" class="text-lg font-bold thermal-text">--°C</div>
                </div>

                <div class="flow-line hidden md:block"></div>

                <div class="text-center">
                    <div id="vis-plate" class="cold-plate thermal-bg bg-blue-900/20 shadow-lg flex items-center justify-center">
                        <div class="w-full h-[2px] bg-white/5"></div>
                        <div class="absolute -bottom-6 left-0 right-0 text-[10px] font-bold text-gray-400 uppercase">Heat Sink / Plate</div>
                    </div>
                    <div id="txt-ts" class="mt-8 text-2xl font-black thermal-text">--°C</div>
                    <div class="node-label text-yellow-500">Surface (T<sub>S</sub>)</div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="card p-6 space-y-5">
                <h3 class="text-sm font-bold text-gray-400 uppercase tracking-widest border-b border-gray-800 pb-2">Load & Environment</h3>
                <div>
                    <label>Power Dissipation [W]</label>
                    <input type="number" id="power" value="65" oninput="calculate()">
                </div>
                <div>
                    <label>Reference Temp [°C]</label>
                    <input type="number" id="t_ref" value="45" oninput="calculate()">
                    <select id="mode" class="mt-2 text-xs" onchange="calculate()">
                        <option value="amb">Reference is Ambient (Air)</option>
                        <option value="sink">Reference is Sink (Liquid)</option>
                    </select>
                </div>
            </div>

            <div class="card p-6 space-y-4">
                <h3 class="text-sm font-bold text-gray-400 uppercase tracking-widest border-b border-gray-800 pb-2">Material Stack</h3>
                <div>
                    <label>Preset TIM Material</label>
                    <select id="tim_preset" onchange="applyTIM()">
                        <option value="5.0">High Perf. Gap Pad (5 W/mK)</option>
                        <option value="1.0">Standard Silicone (1 W/mK)</option>
                        <option value="11.0">Liquid Metal (11 W/mK)</option>
                        <option value="0.04">Air Gap (0.04 W/mK)</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label>Cond. [W/mK]</label>
                        <input type="number" id="k_val" value="5.0" step="0.1" oninput="calculate()">
                    </div>
                    <div>
                        <label>Thick. [mm]</label>
                        <input type="number" id="thickness" value="0.5" step="0.05" oninput="calculate()">
                    </div>
                </div>
                <div>
                    <label>Area [mm²]</label>
                    <input type="number" id="area" value="150" oninput="calculate()">
                </div>
            </div>

            <div class="card p-6 flex flex-col justify-between border-blue-500/20">
                <div class="space-y-4">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-gray-500">R<sub>θJC</sub> (Fixed)</span>
                        <input type="number" id="r_jc" value="0.22" class="w-16 !p-1 text-right" oninput="calculate()">
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-bold">Total Resistance</span>
                        <span id="res-total" class="text-blue-400 font-mono">-- K/W</span>
                    </div>
                </div>

                <div class="pt-6 text-center">
                    <p id="status-text" class="text-[10px] font-black uppercase tracking-tighter mb-2">System Stable</p>
                    <div class="text-6xl font-black tracking-tighter" id="res-tj">--</div>
                    <div class="w-full bg-gray-900 h-1 mt-4 rounded-full overflow-hidden">
                        <div id="heat-bar" class="h-full bg-blue-500 transition-all duration-500" style="width: 40%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function applyTIM() {
            document.getElementById('k_val').value = document.getElementById('tim_preset').value;
            calculate();
        }

        function getThermalColor(temp, max) {
            const min = 25;
            let ratio = (temp - min) / (max - min);
            ratio = Math.max(0, Math.min(1, ratio));
            
            // Interpolate Blue (Cool) to Red (Hot)
            const r = Math.floor(59 + (239 - 59) * ratio);
            const g = Math.floor(130 + (68 - 130) * ratio);
            const b = Math.floor(246 + (68 - 246) * ratio);
            
            return `rgb(${r}, ${g}, ${b})`;
        }

        function calculate() {
            const P = parseFloat(document.getElementById('power').value) || 0;
            const Tref = parseFloat(document.getElementById('t_ref').value) || 0;
            const TjMax = parseFloat(document.getElementById('tj_max').value) || 125;
            const mode = document.getElementById('mode').value;

            const Rjc = parseFloat(document.getElementById('r_jc').value) || 0;
            const k = parseFloat(document.getElementById('k_val').value) || 1;
            const t = parseFloat(document.getElementById('thickness').value) || 0.1;
            const A = parseFloat(document.getElementById('area').value) || 1;

            // R_tim = L / (k*A)
            const Rtim = (t / 1000) / (k * (A / 1000000));
            const totalR = Rjc + Rtim;

            const Tj = Tref + (P * totalR);
            const Tc = Tj - (P * Rjc);
            const Ts = Tref;

            // Update Text
            document.getElementById('res-tj').innerText = Tj.toFixed(1) + "°";
            document.getElementById('txt-tj').innerText = Tj.toFixed(1) + "°C";
            document.getElementById('txt-tc').innerText = Tc.toFixed(1) + "°C";
            document.getElementById('txt-ts').innerText = Ts.toFixed(1) + "°C";
            document.getElementById('res-total').innerText = totalR.toFixed(3) + " K/W";

            // Update Colors based on hotness
            const junctionColor = getThermalColor(Tj, TjMax);
            const caseColor = getThermalColor(Tc, TjMax);
            const plateColor = getThermalColor(Ts, TjMax);

            document.getElementById('vis-die').style.backgroundColor = junctionColor;
            document.getElementById('txt-tj').style.color = junctionColor;
            
            document.getElementById('vis-junction').style.borderColor = junctionColor;
            document.getElementById('vis-tim').style.backgroundColor = caseColor;
            document.getElementById('txt-tc').style.color = caseColor;
            
            document.getElementById('vis-plate').style.backgroundColor = `${plateColor}22`; // Low opacity bg
            document.getElementById('vis-plate').style.borderColor = plateColor;
            document.getElementById('txt-ts').style.color = plateColor;

            // Status Bar
            const pct = Math.min((Tj / TjMax) * 100, 100);
            const bar = document.getElementById('heat-bar');
            bar.style.width = pct + "%";
            bar.style.backgroundColor = junctionColor;

            const status = document.getElementById('status-text');
            if(Tj > TjMax) {
                status.innerText = "Critical Failure";
                status.style.color = "#ff4d4d";
            } else {
                status.innerText = "System Stable";
                status.style.color = "#4ade80";
            }
        }

        window.onload = calculate;
    </script>
</body>
</html>
