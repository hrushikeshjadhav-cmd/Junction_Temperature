<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronics Junction Temperature</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #0f1111; color: white; font-family: 'Inter', sans-serif; }
        .card { background: #1c1e20; border: 1px solid #333; border-radius: 12px; }
        input { 
            background: #2a2d30; 
            border: 1px solid #444; 
            color: white; 
            padding: 12px; 
            border-radius: 8px; 
            width: 100%; 
            font-size: 1.1rem;
        }
        input:focus { border-color: #60a5fa; outline: none; background: #32363a; }
        label { 
            display: block; 
            font-size: 1rem; 
            color: #d1d5db; 
            margin-bottom: 8px; 
            font-weight: 500;
        }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-7xl mx-auto">
        <header class="mb-10 border-b border-gray-700 pb-6">
            <h1 class="text-4xl font-extrabold text-blue-400 tracking-tight">Electronics Junction Temperature</h1>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="card p-8">
                <h2 class="text-lg uppercase tracking-widest mb-6 text-gray-500 font-bold border-b border-gray-700 pb-2">1. Physics & Power</h2>
                <div class="space-y-6">
                    <div>
                        <label>Power Dissipation (P) [W]</label>
                        <input type="number" id="power" value="55" oninput="calculate()">
                    </div>
                    <div class="pt-6 border-t border-gray-700">
                        <p class="text-sm text-blue-400 font-bold mb-4 uppercase">Gap Pad (Rth-TGP Calculation)</p>
                        <div class="space-y-4">
                            <div>
                                <label>Thickness (t) [mm]</label>
                                <input type="number" id="thickness" value="0.508" step="0.001" oninput="calculate()">
                            </div>
                            <div>
                                <label>Conductivity (k) [W/m·K]</label>
                                <input type="number" id="k_val" value="5" step="0.1" oninput="calculate()">
                            </div>
                            <div>
                                <label>Area (A) [mm²]</label>
                                <input type="number" id="area" value="128.1" step="0.1" oninput="calculate()">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card p-8">
                <h2 class="text-lg uppercase tracking-widest mb-6 text-gray-500 font-bold border-b border-gray-700 pb-2">2. Resistance Network</h2>
                <div class="space-y-6">
                    <div>
                        <label>Rth-JC (Junction-to-Case)</label>
                        <input type="number" id="r_jc" value="0.19" step="0.01" oninput="calculate()">
                    </div>
                    <div>
                        <label>Rth-CS (Case-to-Sink / CCS)</label>
                        <input type="number" id="r_cs" value="0.1" step="0.01" oninput="calculate()">
                    </div>
                    <div>
                        <label>Rth-SA (Sink-to-Ambient)</label>
                        <input type="number" id="r_sa" value="0.5" step="0.01" oninput="calculate()">
                    </div>
                </div>
            </div>

            <div class="card p-8 bg-black border-blue-900/50">
                <h2 class="text-lg uppercase tracking-widest mb-6 text-green-500 font-bold border-b border-green-900/30 pb-2">3. Outputs</h2>
                
                <div class="space-y-8">
                    <div class="p-6 bg-gray-900 rounded-xl border border-gray-800">
                        <div class="mb-6">
                            <label class="text-white">Ambient Temp (TA) [°C]</label>
                            <input type="number" id="t_ambient" value="55" oninput="calculate()">
                        </div>
                        <div>
                            <label class="text-yellow-500 font-bold">Cold Plate Surface Temp (TS) [°C]</label>
                            <input type="number" id="t_surface" value="77.5" step="0.1" placeholder="Empty = Use Ambient" oninput="calculate()">
                            <p class="text-xs text-gray-500 mt-3 italic">*If Cold Plate is empty, calculation defaults to Ambient path.</p>
                        </div>
                    </div>

                    <div class="border-t border-gray-800 pt-6 space-y-3">
                        <div class="flex justify-between items-center text-sm md:text-base">
                            <span class="text-gray-400">Calculated Rth-TGP:</span>
                            <span id="out-rtgp" class="font-mono text-blue-400 font-bold text-lg">--</span>
                        </div>
                        <div class="flex justify-between items-center text-sm md:text-base">
                            <span class="text-gray-400">Selected Case Total Resistance:</span>
                            <span id="out-rtotal" class="font-mono text-blue-400 font-bold text-lg">--</span>
                        </div>
                    </div>

                    <div class="text-center bg-blue-900/20 p-8 rounded-2xl border border-blue-500/30">
                        <span class="text-sm text-blue-400 uppercase tracking-widest font-bold block mb-2">Final Junction Temp (TJ)</span>
                        <span id="out-tj" class="text-6xl font-black text-white tracking-tighter">-- °C</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const P = parseFloat(document.getElementById('power').value) || 0;
            const Ta = parseFloat(document.getElementById('t_ambient').value) || 0;
            const Ts_val = document.getElementById('t_surface').value;
            const Ts = parseFloat(Ts_val);

            const Rjc = parseFloat(document.getElementById('r_jc').value) || 0;
            const Rcs = parseFloat(document.getElementById('r_cs').value) || 0;
            const Rsa = parseFloat(document.getElementById('r_sa').value) || 0;

            const t_mm = parseFloat(document.getElementById('thickness').value) || 0;
            const k = parseFloat(document.getElementById('k_val').value) || 0;
            const A_mm2 = parseFloat(document.getElementById('area').value) || 0;

            let Rtgp = 0;
            if (k > 0 && A_mm2 > 0) {
                Rtgp = (t_mm / 1000) / (k * (A_mm2 / 1000000));
            }

            let finalTj = 0;
            let effectiveR = 0;

            if (Ts_val === "" || isNaN(Ts)) {
                effectiveR = Rjc + Rtgp + Rsa; 
                finalTj = Ta + (P * effectiveR);
            } else {
                effectiveR = Rjc + Rtgp;
                finalTj = Ts + (P * effectiveR);
            }

            document.getElementById('out-rtgp').innerText = Rtgp.toFixed(4) + " K/W";
            document.getElementById('out-rtotal').innerText = effectiveR.toFixed(4) + " K/W";
            document.getElementById('out-tj').innerText = finalTj.toFixed(2) + " °C";
        }

        window.onload = calculate;
    </script>
</body>
</html>
